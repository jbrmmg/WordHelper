services:
  wordhelper-dev:
    image: nexus.jbrmmg.me.uk:8084/wordhelper-dev:latest
    container_name: wordhelper-dev
    restart: unless-stopped
    volumes:
      - /var/lib/wordhelper:/var/lib/wordhelper
    networks:
      jbr-network:
        aliases:
          - wordhelper

  wordclue-dev:
    image: nexus.jbrmmg.me.uk:8084/wordclue-dev:latest
    container_name: wordclue-dev
    restart: unless-stopped
    volumes:
      - /var/lib/wordhelper:/var/lib/wordhelper
    networks:
      jbr-network:
        aliases:
          - wordclue

  connections-dev:
    image: nexus.jbrmmg.me.uk:8084/connections-dev:latest
    container_name: connections-dev
    restart: unless-stopped
    networks:
      jbr-network:
        aliases:
          - connections

  codeword-dev:
    image: nexus.jbrmmg.me.uk:8084/codeword-dev:latest
    container_name: codeword-dev
    restart: unless-stopped
    networks:
      jbr-network:
        aliases:
          - codeword

networks:
  jbr-network:
    external: true
